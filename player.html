<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | BFC</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        /* RM THEME */
        body { font-family: 'Montserrat', sans-serif; background-color: #f0f2f5; color: #001a4b; margin: 0; padding: 0; }
        .container { max-width: 900px; margin: 50px auto; padding: 20px; }
        
        .profile-card {
            background: white; border-radius: 12px; overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 26, 75, 0.1); display: flex; flex-wrap: wrap;
            border-top: 5px solid #FEBE10; /* Gold Top Border */
        }
        .profile-img-section {
            flex: 1; background: #e6e6e6; display: flex;
            align-items: center; justify-content: center; padding: 40px; min-width: 300px;
        }
        .profile-img {
            width: 220px; height: 220px; border-radius: 50%; border: 6px solid white; object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.1);
        }
        .info-section { flex: 1.5; padding: 40px; background: white; }
        
        h1 { font-family: 'Oswald', sans-serif; font-size: 3.5rem; margin: 0; color: #001a4b; text-transform: uppercase; line-height: 1; }
        .jersey-no { color: #FEBE10; font-size: 2rem; font-family: 'Oswald', sans-serif; margin-bottom: 10px; display: block; font-weight: bold; }
        .stat-row { display: flex; justify-content: space-between; border-bottom: 1px solid #eee; padding: 20px 0; }
        .stat-label { color: #888; font-weight: 600; text-transform: uppercase; font-size: 0.9rem; }
        .stat-value { color: #001a4b; font-weight: 700; font-size: 1.1rem; }
        
        .back-btn {
            display: inline-block; margin-top: 30px; padding: 12px 30px; 
            background: #001a4b; color: white;
            text-decoration: none; font-weight: bold; border-radius: 4px; 
            font-family: 'Oswald', sans-serif; letter-spacing: 1px;
            transition: 0.3s;
        }
        .back-btn:hover { background: #FEBE10; color: #001a4b; }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="profile-img-section">
                <img src="https://via.placeholder.com/200/001a4b/ffffff?text=BFC" id="p-img" class="profile-img">
            </div>
            <div class="info-section">
                <span class="jersey-no" id="p-jersey">#--</span>
                <h1 id="p-name">Loading...</h1>
                <p style="color: #666; margin-top: 5px; font-weight: 500;">BFC FIRST TEAM</p>

                <div class="stat-row">
                    <span class="stat-label">Position</span>
                    <span class="stat-value" id="p-pos">--</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Nationality</span>
                    <span class="stat-value">Bangladesh</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">Status</span>
                    <span class="stat-value">Available</span>
                </div>

                <a href="index.html" class="back-btn">← BACK TO SQUAD</a>
            </div>
        </div>
    </div>

    <script>
        const players = {
            1: { name: "SHUVO", pos: "Midfielder" },
            2: { name: "ZIHAD", pos: "Striker" },
            3: { name: "SABBIR", pos: "Winger" },
            4: { name: "TAREK", pos: "Winger" },
            5: { name: "AHAD", pos: "Defender" },
            6: { name: "FOYSHAL", pos: "Defender" },
            7: { name: "NAIMUL", pos: "Defender" },
            8: { name: "ASIF", pos: "Goalkeeper" },
            9: { name: "TABIB", pos: "Midfielder" },
            10: { name: "NADIM", pos: "Defender" },
            11: { name: "JAKIR", pos: "Defender" },
            12: { name: "ARAFAT", pos: "Defender" },
            13: { name: "TANZIM", pos: "Striker" },
            14: { name: "RATUL", pos: "Defender" },
            15: { name: "NEHAL", pos: "Winger" },
            16: { name: "HAMIM", pos: "Midfielder" },
            17: { name: "SHAHRIA", pos: "Goalkeeper" },
            18: { name: "SAMI", pos: "Midfielder" },
            19: { name: "RAIHAN", pos: "Goalkeeper" },
            20: { name: "MOSTAFIZ", pos: "Midfielder" },
            21: { name: "DUROBO", pos: "Defender" },
            22: { name: "MIRAJ", pos: "Defender" },
            23: { name: "BORSHON", pos: "Striker" },
            24: { name: "SABUJ", pos: "Goalkeeper" },
            25: { name: "FAHIM", pos: "Defender" },
            26: { name: "SIAM", pos: "Midfielder" },
            27: { name: "WAHID", pos: "Defender" },
            28: { name: "PIYASH", pos: "Midfielder" },
            29: { name: "SAYEM", pos: "Defender" },
            30: { name: "MANIK", pos: "Defender" },
            31: { name: "NADIM", pos: "Defender" },
            32: { name: "OVI", pos: "Defender" }
        };

        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');

        if(id && players[id]) {
            document.getElementById('p-jersey').innerText = "#" + (id < 10 ? '0'+id : id);
            document.getElementById('p-name').innerText = players[id].name;
            document.getElementById('p-pos').innerText = players[id].pos;
        } else {
            document.getElementById('p-name').innerText = "Player Not Found";
        }
    </script>
</body>
</html>
