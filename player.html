<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Player Profile | BFC</title>
    <link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;700&family=Roboto:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Roboto', sans-serif; background-color: #0f1215; color: #e0e0e0; margin: 0; padding: 0; }
        .container { max-width: 800px; margin: 50px auto; padding: 20px; }
        
        /* PROFILE CARD */
        .profile-card {
            background: #1e2329; border: 1px solid #333; border-radius: 15px; overflow: hidden;
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.1); display: flex; flex-wrap: wrap;
        }
        .profile-img-section {
            flex: 1; background: linear-gradient(135deg, #004d00, #000); display: flex;
            align-items: center; justify-content: center; padding: 40px; min-width: 300px;
        }
        .profile-img {
            width: 200px; height: 200px; border-radius: 50%; border: 5px solid #00ff88; object-fit: cover;
        }
        .info-section { flex: 1.5; padding: 40px; }
        
        h1 { font-family: 'Oswald', sans-serif; font-size: 3rem; margin: 0; color: white; text-transform: uppercase; }
        .jersey-no { color: #00ff88; font-size: 1.5rem; font-family: 'Oswald', sans-serif; margin-bottom: 20px; display: block; }
        .stat-row { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 15px 0; }
        .stat-label { color: #888; font-weight: bold; }
        .stat-value { color: white; font-weight: 500; }
        
        .back-btn {
            display: inline-block; margin-top: 30px; padding: 10px 25px; background: #00ff88; color: #000;
            text-decoration: none; font-weight: bold; border-radius: 5px; font-family: 'Oswald', sans-serif;
        }
        .back-btn:hover { background: white; }
    </style>
</head>
<body>

    <div class="container">
        <div class="profile-card">
            <div class="profile-img-section">
                <img src="https://via.placeholder.com/200/004d00/ffffff?text=BFC" id="p-img" class="profile-img">
            </div>
            <div class="info-section">
                <span class="jersey-no" id="p-jersey">JERSEY: --</span>
                <h1 id="p-name">Loading...</h1>
                <p style="color: #aaa; margin-top: 5px;">Bottola Football Club Player</p>

                <div class="stat-row">
                    <span class="stat-label">POSITION</span>
                    <span class="stat-value" id="p-pos">--</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">AGE</span>
                    <span class="stat-value" id="p-age">-- Years</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">FAVORITE TEAM</span>
                    <span class="stat-value" id="p-fav">--</span>
                </div>
                <div class="stat-row">
                    <span class="stat-label">STATUS</span>
                    <span class="stat-value">Active Squad Member</span>
                </div>

                <a href="index.html" class="back-btn">← BACK TO SQUAD</a>
            </div>
        </div>
    </div>

    <script>
        // --- UPDATED PLAYER DATABASE ---
        const players = {
            1: { name: "SHUVO", pos: "Midfielder" },
            2: { name: "ZIHAD", pos: "Striker" },
            3: { name: "SABBIR", pos: "Winger" },
            4: { name: "TAREK", pos: "Winger" },
            5: { name: "AHAD", pos: "Defender" },
            6: { name: "FOYSHAL", pos: "Defender" },
            7: { name: "NAIMUL", pos: "Defender" },
            8: { name: "ASIF", pos: "Goalkeeper" },
            9: { name: "TABIB", pos: "Midfielder" },
            10: { name: "NADIM", pos: "Defender" },
            11: { name: "JAKIR", pos: "Defender" },
            12: { name: "ARAFAT", pos: "Defender" },
            13: { name: "TANZIM", pos: "Striker" },
            14: { name: "RATUL", pos: "Defender" },
            15: { name: "NEHAL", pos: "Winger" },
            16: { name: "HAMIM", pos: "Midfielder" },
            17: { name: "SHAHRIA", pos: "Goalkeeper" },
            18: { name: "SAMI", pos: "Midfielder" },
            19: { name: "RAIHAN", pos: "Goalkeeper" },
            20: { name: "MOSTAFIZ", pos: "Midfielder" },
            21: { name: "DUROBO", pos: "Defender" },
            22: { name: "MIRAJ", pos: "Defender" },
            23: { name: "BORSHON", pos: "Striker" },
            24: { name: "SABUJ", pos: "Goalkeeper" },
            25: { name: "FAHIM", pos: "Defender" },
            26: { name: "SIAM", pos: "Midfielder" },
            27: { name: "WAHID", pos: "Defender" },
            28: { name: "PIYASH", pos: "Midfielder" },
            29: { name: "SAYEM", pos: "Defender" },
            30: { name: "MANIK", pos: "Defender" },
            31: { name: "NADIM", pos: "Defender" },
            32: { name: "OVI", pos: "Defender" }
        };

        // Get ID from URL
        const params = new URLSearchParams(window.location.search);
        const id = params.get('id');
        const urlName = params.get('name');

        if(id) {
            document.getElementById('p-jersey').innerText = "JERSEY: " + (id < 10 ? '0'+id : id);
            
            if(players[id]) {
                document.getElementById('p-name').innerText = players[id].name;
                document.getElementById('p-pos').innerText = players[id].pos;
                // Default placeholders for Age/Fav Team (Edit in code if needed)
                document.getElementById('p-age').innerText = "20 Years"; 
                document.getElementById('p-fav').innerText = "BFC"; 
            } else {
                document.getElementById('p-name').innerText = urlName || "Unknown Player";
            }
        }
    </script>
</body>
</html>
